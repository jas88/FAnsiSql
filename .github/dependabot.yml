version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  target-branch: main
  schedule:
    interval: daily
- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  target-branch: main
  reviewers:
  - jas88
  ignore:
  # 11.x only supports net10+; FAnsi still targets net8/net9
  - dependency-name: "System.Security.Cryptography.Pkcs"
    update-types: ["version-update:semver-major"]
- package-ecosystem: "dotnet-sdk"
  directory: "/"
  schedule:
    interval: weekly
